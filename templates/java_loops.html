<h1>🔁 Java Loops</h1>

<p>Loops are used to execute a block of code repeatedly.</p>

<h2>Types</h2>

<ul>

<li>For Loop</li>

<li>While Loop</li>

<li>Do While Loop</li>

</ul>

<h2>For Loop Example</h2>

<pre>
for(int i=1;i<=5;i++){

System.out.println(i);

}
</pre>

<h2>Output</h2>

<pre>
1
2
3
4
5
</pre>
