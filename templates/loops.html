    <h1>🔁 Loops in Python</h1>

    <p>
        Loops are used to repeat a block of code multiple times.
    </p>

    <h2>Types of Loops</h2>

    <ul>
        <li>For Loop</li>
        <li>While Loop</li>
    </ul>

    <h2>For Loop Example</h2>

<pre>
for i in range(1,6):
    print(i)
</pre>

    <h2>Output</h2>

<pre>
1
2
3
4
5
</pre>

    <h2>While Loop Example</h2>

<pre>
i = 1

while i <= 5:
    print(i)
    i += 1
</pre>
